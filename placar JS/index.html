<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <title>PLACAR</title>
</head>
<body>
    <h1>Placar</h1>
    <section id="tela-placar">
        <div id="placar-esquerda">
            <button class="bt-placar" onclick="incrementarEsquerda()">
                <img class="icone-placar" src ="img/icon-park-twotone--up-c.svg" alt="">
            </button>
            <p id="valor-esq">0</p>
            <button class="bt-placar"  onclick="decrementarEsquerda()">
                <img class="icone-placar" src="img/icon-park-twotone--down-c.svg" alt="">
            </button>
        </div>

        <div id="placar-meio">
            <p id="cronometro"></p>
            <button id="bt-play" onclick="acionarCronometro()">play</button>
            <p id="x">x</p>
            <button id="bt-reset" onclick="resetar()">
              <img id="icone-reset" src="img/icon-park-twotone--refresh-one.svg" alt="">
            </button>
        </div>
        

        <div id="placar-direita">
            <button class="bt-placar" onclick="incrementarDireita()">
                <img class="icone-placar" src="img/icon-park-twotone--up-c.svg" alt="">
            </button>
            <p id="valor-dir">0</p>
            <button class="bt-placar" onclick="decrementarDireita()">
                <img class="icone-placar" src="img/icon-park-twotone--down-c.svg" alt="">
            </button>
        </div>
        

    </section>
    <script src="script.js"></script>
</body>
</html>
